name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Sync version to package.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CLEAN_VERSION="${VERSION#v}"
          echo "Setting version to $CLEAN_VERSION"
          cd apps/momai
          pnpm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Download dependency wheels
        shell: pwsh
        run: |
          $binDir = "apps/momai/bin"
          $wheelsDir = "$binDir/wheels"
          $lockFile = "$binDir/requirements-win.lock"
          $pythonExe = "$binDir/python/python.exe"

          uv pip compile apps/core/pyproject.toml `
            --python-version 3.12 `
            --python-platform windows `
            --output-file $lockFile

          if (-not (Test-Path $pythonExe)) {
            Write-Host "Bundled Python not found, skipping wheel download"
            exit 0
          }

          New-Item -ItemType Directory -Path $wheelsDir -Force | Out-Null
          & $pythonExe -m pip download `
            -d $wheelsDir `
            -r $lockFile `
            --only-binary :all: `
            --platform win_amd64 `
            --python-version 3.12 `
            --implementation cp `
            --quiet

      - name: Build Windows
        run: pnpm --filter momai build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-artifacts
          path: |
            apps/momai/dist/*.exe
            apps/momai/dist/*.yml
            apps/momai/dist/*.blockmap
          if-no-files-found: error
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Sync version to package.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CLEAN_VERSION="${VERSION#v}"
          echo "Setting version to $CLEAN_VERSION"
          cd apps/momai
          pnpm version "$CLEAN_VERSION" --no-git-tag-version --allow-same-version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xvfb \
            rpm \
            fakeroot

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Download dependency wheels
        run: |
          BIN_DIR="apps/momai/bin"
          WHEELS_DIR="$BIN_DIR/wheels"
          LOCK_FILE="$BIN_DIR/requirements-linux.lock"
          PYTHON_EXE="$BIN_DIR/python/bin/python3"

          uv pip compile apps/core/pyproject.toml \
            --python-version 3.12 \
            --python-platform linux \
            --output-file "$LOCK_FILE"

          if [ ! -f "$PYTHON_EXE" ]; then
            echo "Bundled Python not found, skipping wheel download"
            exit 0
          fi

          chmod +x "$PYTHON_EXE"
          mkdir -p "$WHEELS_DIR"
          PLATFORMS=("manylinux2014_x86_64" "manylinux_2_28_x86_64")
          DOWNLOAD_OK=0
          for PLATFORM in "${PLATFORMS[@]}"; do
            echo "Trying wheel download for $PLATFORM..."
            if "$PYTHON_EXE" -m pip download \
              -d "$WHEELS_DIR" \
              -r "$LOCK_FILE" \
              --only-binary :all: \
              --platform "$PLATFORM" \
              --python-version 3.12 \
              --implementation cp \
              --quiet; then
              DOWNLOAD_OK=1
              echo "Wheel download succeeded for $PLATFORM"
              break
            fi
          done

          if [ "$DOWNLOAD_OK" -ne 1 ]; then
            echo "WARNING: Could not pre-download all Linux wheels. Build will continue with online fallback."
          fi

      - name: Build Linux
        run: pnpm --filter momai build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            apps/momai/dist/*.AppImage
            apps/momai/dist/*.deb
            apps/momai/dist/*.yml
            apps/momai/dist/*.blockmap
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-artifacts
          path: dist/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/linux

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: List release files
        run: |
          echo "=== Windows ==="
          find dist/win -type f | head -20
          echo "=== Linux ==="
          find dist/linux -type f | head -20

      - name: Initialize public repo if empty
        run: |
          set -e
          REPO="WesleyQDev/MomAI-App"

          # Verifica se o repo tem commits checando a API
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/commits?per_page=1")

          if [ "$STATUS" = "409" ] || [ "$STATUS" = "404" ]; then
            echo "📝 Repositório vazio. Inicializando com README..."
            RESPONSE=$(curl -s -X PUT \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/contents/README.md" \
              -d '{"message":"Initial commit","content":"IyBNb21BSSBEb3dubG9hZHMKClJlcG9zaXTDs3JpbyBkZSBkaXN0cmlidWnDp8OjbyBkbyBNb21BSS4="}')
            
            # Verifica se o upload foi bem sucedido
            if echo "$RESPONSE" | grep -q '"content"'; then
              echo "✅ README criado com sucesso!"
            else
              echo "❌ Falha ao criar README: $RESPONSE"
              exit 1
            fi
            sleep 3
          elif [ "$STATUS" = "200" ]; then
            echo "✅ Repositório já inicializado."
          else
            echo "❌ Status inesperado: $STATUS"
            exit 1
          fi
        # Token: fine-grained PAT with scope:
        #   - Resource owner: WesleyQDev
        #   - Repository: WesleyQDev/MomAI-App
        #   - Permissions: Contents: Read and write
        #   - Expiration: short (configure in GitHub token settings)
        env:
          GH_TOKEN: ${{ secrets.MOMAI_APP_RELEASE_TOKEN }}

      - name: Create Release on Public Repo
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="WesleyQDev/MomAI-App"

          # Remove arquivos de debug para evitar conflito de nomes
          rm -f dist/win/builder-debug.yml dist/linux/builder-debug.yml

          # Coleta arquivos de forma mais robusta
          WIN_FILES=$(find dist/win -type f -print | tr '\n' ' ')
          LINUX_FILES=$(find dist/linux -type f -print | tr '\n' ' ')
          ALL_FILES="$WIN_FILES $LINUX_FILES"

          if [ -z "$(echo $ALL_FILES | tr -d ' ')" ]; then
            echo "❌ Nenhum arquivo encontrado!"
            exit 1
          fi

          echo "📦 Gerenciando release $VERSION no repo $REPO..."
          echo "📁 Arquivos Windows: $WIN_FILES"
          echo "📁 Arquivos Linux: $LINUX_FILES"

          # Se o release já existir, apenas faz upload dos novos arquivos (clobber)
          # Caso contrário, cria um novo release.
          if gh release view "$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            echo "✅ Release $VERSION já existe. Atualizando arquivos..."
            gh release upload "$VERSION" \
              --repo "$REPO" \
              --clobber \
              dist/win/* dist/linux/*
          else
            echo "✨ Criando novo release $VERSION..."
            gh release create "$VERSION" \
              --repo "$REPO" \
              --title "MomAI $VERSION" \
              --latest \
              dist/win/* dist/linux/*
          fi
        env:
          GH_TOKEN: ${{ secrets.MOMAI_APP_RELEASE_TOKEN }}
