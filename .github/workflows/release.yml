name: Release WhatsApp Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: extension

      # The extension UI is built with esbuild aliases that point into the MomAI
      # renderer source (momai:registry, momai:api, momai:image-viewer, etc.).
      # build.mjs resolves those aliases relative to
      # apps/momai/scripts/skills/packaged/whatsapp/, so we need the extension
      # inside the MomAI tree to build correctly.
      - name: Checkout MomAI source
        uses: actions/checkout@v4
        with:
          repository: WesleyQDev/MomAI
          path: momai
          token: ${{ secrets.MOMAI_PAT }}

      - name: Place extension into MomAI tree
        shell: pwsh
        run: |
          $dest = "momai\apps\momai\scripts\skills\packaged\whatsapp"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Get-ChildItem -Path extension -Exclude @('.git') | Copy-Item -Destination $dest -Recurse -Force
          Get-ChildItem -Path $dest | Select-Object Name

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Debug tree structure
        shell: pwsh
        run: |
          Get-ChildItem -Recurse momai/apps/momai/scripts/skills/packaged/whatsapp | Select-Object -First 30
          Test-Path momai/apps/momai/src/renderer/src/components/chat/SkillResponseRegistry.ts
          Test-Path momai/apps/momai/src/renderer/src/services/api.ts
          Test-Path momai/apps/momai/src/renderer/src/components/ImageViewer.tsx

      # pnpm com --frozen-lockfile aplica o patch do Baileys (assertSessions
      # per-JID em mensagens de grupo) via patchedDependencies; `npm install`
      # não aplicava o patch e regredia o envio para grupos.
      - name: Install dependencies
        shell: pwsh
        run: |
          cd momai/apps/momai/scripts/skills/packaged/whatsapp
          pnpm install --frozen-lockfile

      - name: Build UI
        shell: pwsh
        run: |
          cd momai/apps/momai/scripts/skills/packaged/whatsapp
          node build.mjs

      - name: Create release zip
        shell: pwsh
        run: |
          cd momai/apps/momai/scripts/skills/packaged/whatsapp
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $zipName = "momai-whatsapp-extension-v$version.zip"
          # Os runtimes são .ts (Node do Electron roda .ts por type stripping);
          # o background-worker carrega baileys-cred-migration + fs-permissions, e
          # baileys-cred-migration carrega secure-storage-bridge.
          $items = @(
            'manifest.json',
            'SKILL.md',
            'package.json',
            'runtime.ts',
            'background-worker.ts',
            'worker-utils.ts',
            'baileys-cred-migration.ts',
            'fs-permissions.ts',
            'secure-storage-bridge.ts',
            'icon.svg',
            'dist',
            'locales',
            'node_modules'
          )
          Compress-Archive -Path $items -DestinationPath $zipName -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-extension-${{ github.run_id }}
          path: momai/apps/momai/scripts/skills/packaged/whatsapp/${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: momai/apps/momai/scripts/skills/packaged/whatsapp/${{ env.ZIP_NAME }}
          generate_release_notes: true
