name: Check PR Template

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  validate:
    name: Validate PR template
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body against template
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Skip Dependabot PRs
            if (context.payload.pull_request.user.login === 'dependabot[bot]') {
              console.log('Skipping Dependabot PR');
              return;
            }

            // Skip draft PRs
            if (context.payload.pull_request.draft) {
              console.log('Skipping draft PR');
              return;
            }

            const errors = [];

            // 1. Check required sections
            const requiredSections = [
              '## Descrição',
              '## Tipo de Mudança',
              '## Checklist',
              '## Verificações Técnicas',
              '## Como foi testado',
              '## Dependências'
            ];

            for (const section of requiredSections) {
              if (!body.includes(section)) {
                errors.push(`Seção obrigatória ausente: \`${section}\``);
              }
            }

            // 2. Check required checkboxes in Checklist section
            const requiredCheckboxes = [
              'Li o [CONTRIBUTING.md]',
              'Li o [AGENTS.md]',
              'Minha contribuição é original',
              'Li e concordo com os termos do [CLA.md]',
              'Entendo que o projeto possui licença proprietária',
              'Entendo que este Pull Request pode ser rejeitado'
            ];

            for (const checkbox of requiredCheckboxes) {
              const regex = new RegExp(`- \\[x\\].*${checkbox.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
              if (!regex.test(body)) {
                errors.push(`Checkbox obrigatória não marcada: \`${checkbox}\``);
              }
            }

            // 3. Check for broken characters (common PowerShell escaping issue)
            const brokenCharPatterns = [
              /[\x00-\x08\x0B\x0C\x0E-\x1F]/,  // control chars
              /\ufffd/,                             // replacement character
              /\\u[0-9a-f]{4}/i                     // unicode escape sequences
            ];

            for (const pattern of brokenCharPatterns) {
              if (pattern.test(body)) {
                errors.push('Corpos de PR contêm caracteres quebrados (possível problema de escaping do PowerShell). Use `gh pr create --body-file arquivo.md` em vez de `--body`.');
                break;
              }
            }

            // 4. Report results
            if (errors.length > 0) {
              const message = [
                '## ⚠️ PR Template — Itens pendentes\n',
                'Este PR não segue completamente o template oficial. Por favor, corrija:\n',
                ...errors.map(e => `- ${e}`),
                '\n---',
                '**Referência:** [`.github/PULL_REQUEST_TEMPLATE.md`](../.github/PULL_REQUEST_TEMPLATE.md)',
                '\n> **Dica:** Use `gh pr create --body-file arquivo.md` em vez de `--body` para evitar caracteres quebrados.'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-template-fix']
              });

              core.setFailed(`PR template validation failed: ${errors.length} issue(s) found`);
            } else {
              console.log('PR template validation passed');

              // Remove label if it was previously set and now fixed
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: 'needs-template-fix'
                });
              } catch (e) {
                // Label might not exist, ignore
              }
            }
