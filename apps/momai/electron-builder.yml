appId: com.wesleyqdev.momai
productName: MomAI
afterPack: ./scripts/after-pack.js
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!bin/**'
  - '!out/bin/**'
  - '!resources/**'
win:
  executableName: MomAI
  artifactName: MomAI-Installer.${ext}
  icon: build/icon.ico
  extraResources:
    - from: '../core'
      to: 'core'
      filter:
        - '!**/.venv'
        - '!**/__pycache__'
        - '!**/bin/**'
        - '!**/models/*'
        - '!**/momai.db'

    - from: 'bin'
      to: 'bin'
      filter:
        - '!**/share/terminfo/**'
        - '!**/python/share/**'
        - '!**/python/bin/**'
        - '!**/python/Lib/test/**'
        - '!**/python/Lib/site-packages/tests/**'
        - '!**/wheels/**'
        - '!**/*.pdb'
    - from: 'bin/wheels/win32'
      to: 'wheels/win32'
    - from: 'resources'
      to: '.'
    - from: 'build'
      to: 'build'
      filter:
        - 'icon.ico'
        - 'icon.png'
    - from: 'build/diagnostic.bat'
      to: 'diagnostic.bat'
asarUnpack:
  - 'node_modules/@whiskeysockets/baileys/**'
  - 'node_modules/pino/**'
  - 'node_modules/protobufjs/**'
  - 'node_modules/ws/**'
  - 'node_modules/axios/**'
  - 'node_modules/uuid/**'
  - 'node_modules/lodash/**'
  - 'node_modules/lru-cache/**'
  - 'node_modules/eventemitter3/**'
  - 'node_modules/cache-manager/**'
  - 'node_modules/libphonenumber-js/**'
  - 'node_modules/music-metadata/**'
  - 'node_modules/atomic-sleep/**'
  - 'node_modules/sonic-boom/**'
  - 'node_modules/pino-std-serializers/**'
  - 'node_modules/process-warning/**'
  - 'node_modules/quick-format-unescaped/**'
  - 'node_modules/safe-stable-stringify/**'
  - 'node_modules/thread-stream/**'
  - 'node_modules/@cacheable/**'
  - 'node_modules/@adiwajshing/**'
  - 'node_modules/@hapi/**'
  - 'node_modules/@protobufjs/**'
  - 'node_modules/@tokenizer/**'
  - 'node_modules/@thi.ng/**'
  - 'node_modules/@wasm-audio-decoders/**'
  - 'node_modules/async-lock/**'
  - 'node_modules/audio-decode/**'
  - 'node_modules/curve25519-js/**'
  - 'node_modules/libsignal/**'
  - 'node_modules/content-type/**'
  - 'node_modules/file-type/**'
  - 'node_modules/strtok3/**'
  - 'node_modules/peek-readable/**'
  - 'node_modules/token-types/**'
  - 'node_modules/readable-web-to-node-stream/**'
  - 'node_modules/lodash.clonedeep/**'
  - 'node_modules/promise-coalesce/**'
  - 'node_modules/form-data/**'
  - 'node_modules/follow-redirects/**'
  - 'node_modules/mime-types/**'
  - 'node_modules/proxy-from-env/**'
  - 'node_modules/media-typer/**'
  - 'node_modules/yauzl/**'
  - 'node_modules/pend/**'
  - 'scripts/node-core/utils/zip-extract-worker.js'
nsis:
  artifactName: MomAI-Installer.${ext}
  shortcutName: MomAI
  uninstallDisplayName: MomAI
  createDesktopShortcut: always
  include: build/installer.nsh
  oneClick: true
appx:
  displayName: MomAI - Assistente local
  identityName: WesleyDeveloperStudios.MomAI-Assistentelocal
  applicationId: MomAI
  publisher: CN=DD4A9768-285C-45F0-982B-113F2C63C677
  publisherDisplayName: Wesley Developer Studios
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  languages:
    - pt-BR
    - en-US
  backgroundColor: '#1a1a2e'
  showNameOnTiles: true
  setBuildNumber: false
  customManifestPath: build/appx/AppxManifest.xml
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: MomAI-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: WesleyQDev
  category: Utility
  artifactName: MomAI-${version}.${ext}
  extraResources:
    - from: '../core'
      to: 'core'
      filter:
        - '!**/.venv'
        - '!**/__pycache__'
        - '!**/bin/**'
        - '!**/models/*'
        - '!**/momai.db'

    - from: 'bin'
      to: 'bin'
      filter:
        - '!**/share/terminfo/**'
        - '!**/wheels/**'
        - '!**/*.pdb'
    - from: 'bin/wheels/linux'
      to: 'wheels/linux'
    - from: 'resources'
      to: '.'
    - from: 'build'
      to: 'build'
      filter:
        - 'icon.ico'
        - 'icon.png'
    - from: 'build/diagnostic.sh'
      to: 'diagnostic.sh'
appImage:
  artifactName: MomAI-${version}.${ext}
# Disable electron-builder's automatic `npm rebuild` step during packaging.
# Native modules (better-sqlite3, node-llama-cpp, @whiskeysockets/baileys,
# keytar, etc.) are already rebuilt against the Electron ABI by the
# `electron-builder install-app-deps` step in apps/momai/package.json's
# `postinstall` script, which runs after `pnpm install` and before any
# packaging command. Running it again here would just slow down the build
# without changing the binaries.
npmRebuild: false
publish:
  provider: github
  owner: WesleyQDev
  repo: MomAI-App
