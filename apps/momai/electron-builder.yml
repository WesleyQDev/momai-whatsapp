appId: com.wesleyqdev.momai
productName: MomAI
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: MomAI
  artifactName: MomAI-Installer.${ext}
  icon: build/icon.png
  extraResources:
    - from: '../core'
      to: 'core'
      filter:
        - '!**/.venv'
        - '!**/__pycache__'
        - '!**/bin/**'
        - '!**/models/*'
        - '!**/momai.db'
    - from: '../fortscript'
      to: 'fortscript'
      filter:
        - '!**/.venv'
        - '!**/__pycache__'
    - from: 'bin'
      to: 'bin'
    - from: 'bin/wheels'
      to: 'wheels'
    - from: 'build/diagnostic.bat'
      to: 'diagnostic.bat'
nsis:
  artifactName: MomAI-Installer.${ext}
  shortcutName: MomAI
  uninstallDisplayName: MomAI
  createDesktopShortcut: always
  include: build/installer.nsh
  oneClick: true
appx:
  displayName: MomAI - Assistente local
  identityName: WesleyDeveloperStudios.MomAI-Assistentelocal
  applicationId: MomAI
  publisher: CN=DD4A9768-285C-45F0-982B-113F2C63C677
  publisherDisplayName: Wesley Developer Studios
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  languages:
    - pt-BR
    - en-US
  backgroundColor: '#1a1a2e'
  showNameOnTiles: true
  setBuildNumber: false
  customManifestPath: build/appx/AppxManifest.xml
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: MomAI-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: WesleyQDev
  category: Utility
  artifactName: MomAI-${version}.${ext}
  extraResources:
    - from: '../core'
      to: 'core'
      filter:
        - '!**/.venv'
        - '!**/__pycache__'
        - '!**/bin/**'
        - '!**/models/*'
        - '!**/momai.db'
    - from: '../fortscript'
      to: 'fortscript'
      filter:
        - '!**/.venv'
        - '!**/__pycache__'
    - from: 'bin'
      to: 'bin'
    - from: 'bin/wheels'
      to: 'wheels'
    - from: 'build/diagnostic.sh'
      to: 'diagnostic.sh'
appImage:
  artifactName: MomAI-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: WesleyQDev
  repo: MomAI-App
