[project]
name = "core"
version = "1.5.1"
description = "MomAI Core - Simplified Plugin Runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.138.2",
    "huggingface-hub>=1.21.0",
    "httpx>=0.28.1",
    "numpy>=2.5.0",
    "sqlalchemy>=2.0.51",
    "psutil>=7.2.2",
    "sounddevice>=0.5.5",
    "ctranslate2>=4.8.0,<4.9.0",
    "kokoro-onnx>=0.5.0",
    "faster-whisper>=1.2.1,<1.3.0",
    "python-dotenv>=1.2.2",
    "onnxruntime>=1.20.0,<1.27.0",
    "rapidfuzz>=3.14.5",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "database*", "services*", "utils*"]
exclude = ["data*", "notes*", "models*", "momai_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.138.2",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]
