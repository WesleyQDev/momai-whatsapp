[project]
name = "core"
version = "1.4.0"
description = "MomAI Core - Simplified Plugin Runner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "huggingface-hub>=1.3.2",
    "httpx>=0.28.0",
    "numpy>=2.3.3",
    "sqlalchemy>=2.0.44",
    "psutil>=7.2.1",
    "sounddevice>=0.5.4",
    "ctranslate2>=4.4.0,<4.8.0",
    "kokoro-onnx>=0.5.0",
    "faster-whisper>=1.2.1,<1.3.0",
    "python-dotenv>=1.0.1",
    "onnxruntime>=1.20.0,<1.27.0",
    "rapidfuzz>=3.14.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "database*", "services*", "utils*"]
exclude = ["data*", "notes*", "models*", "momai_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.136.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
]
